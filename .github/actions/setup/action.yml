name: Setup
description: Install Vite+, Node.js, pnpm, and workspace dependencies.

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      with:
        node-version: "24"
        cache: true

    - run: vp install
      shell: bash
