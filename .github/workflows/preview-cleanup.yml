name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same group as the preview job in ci.yml, so the destroy waits for an in-flight deploy.
    concurrency:
      group: alchemy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse non-preview stages
        run: |
          case "$STAGE" in
            pr-[0-9]*) ;;
            *) echo "::error::Refusing to destroy stage '$STAGE'"; exit 1 ;;
          esac

      # The merge ref of a closed PR may be gone; the head commit is what the preview deployed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: vp exec alchemy provider check-env

      - run: vp exec alchemy destroy --stage "$STAGE" --yes
