packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/platform-node": ^4.0.0-rc.115
  "@effect/sql-pg": 4.0.0-rc.115
  "@types/node": ^24
  "@types/pg": ^8.23.1
  drizzle-kit: 1.0.0-rc.5-ab785fc
  drizzle-orm: 1.0.0-rc.5-ab785fc
  effect: 4.0.0-rc.115
  pg: ^8.23.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  workerd: true
overrides:
  "@effect/sql-pg@*": "catalog:"
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.79"
  - "@alchemy.run/floci@2.0.0-beta.79"
  - "@alchemy.run/node-utils@2.0.0-beta.79"
  - alchemy@2.0.0-beta.79
